name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify PrimeNG license secret
        env:
          PRIMENG_LICENSE: ${{ secrets.PRIMENG_LICENSE }}
        run: |
          if [ -z "$PRIMENG_LICENSE" ]; then
            echo "::error::The PRIMENG_LICENSE secret is not available to this repository."
            exit 1
          fi

      - name: Build Angular app
        run: npm run build
        env:
          PRIMENG_LICENSE: ${{ secrets.PRIMENG_LICENSE }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FLOWER_08CA27F0F }}
          action: upload
          app_location: dist/rogers-soft-tech-home/browser
          output_location: ''
          skip_app_build: true
